<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5fa5" />
    <meta name="description" content="Gestione Centro Unitario e Armadi di Ripristino" />
    <title>Centro Unitario</title>

    <!-- Manifest PWA (installabilità) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Shell applicativa: le schermate vengono montate qui dal router (task successivi). -->
    <div id="app" class="app-shell">

        <h1 class="app-titolo">Centro Unitario</h1>
      </header>

      <main id="contenuto" class="app-contenuto" aria-live="polite">
        <p>Caricamento in corso…</p>
      </main>

      <footer class="app-footer">
        <span class="app-versione" data-versione>v0.1.3</span>
      </footer>
    </div>

    <!-- Unico entry point a moduli ES. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
